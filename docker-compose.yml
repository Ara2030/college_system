version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: college_db
    environment:
      POSTGRES_USER: college_user
      POSTGRES_PASSWORD: college_pass
      POSTGRES_DB: college_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Очистка логов, чтобы видеть, почему он упал
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college_user -d college_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - college_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: college_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt
    ports:
      - "8000:8000"
    environment:
      # Важно: здесь hostname 'db' относится к имени сервиса в docker-compose
      - DATABASE_URL=postgresql://college_user:college_pass@db:5432/college_db
    depends_on:
      db:
        condition: service_healthy # Ждем, пока база будет готова
    networks:
      - college_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: college_frontend
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - college_net

volumes:
  pg_data:
    driver: local

networks:
  college_net:
    driver: bridge