<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИС Колледжа - Управление контингентом</title>
    <!-- Подключаем Bootstrap для красивых таблиц и форм -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 900px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">Информационная Система СПО</h2>
    
    <!-- Навигация -->
    <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="students-tab" data-bs-toggle="tab" data-bs-target="#students" type="button">Студенты</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="groups-tab" data-bs-toggle="tab" data-bs-target="#groups" type="button" onclick="loadGroups()">Группы</button>
        </li>
    </ul>

    <div class="tab-content" id="myTabContent">
        <!-- Вкладка Студенты -->
        <div class="tab-pane fade show active" id="students" role="tabpanel">
            <div class="card mb-3">
                <div class="card-header">Добавить студента</div>
                <div class="card-body">
                    <form id="studentForm">
                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <input type="text" class="form-control" id="fullName" placeholder="ФИО" required>
                            </div>
                            <div class="col-md-6 mb-2">
                                <input type="date" class="form-control" id="birthDate">
                            </div>
                            <div class="col-md-6 mb-2">
                                <input type="text" class="form-control" id="snils" placeholder="СНИЛС">
                            </div>
                            <div class="col-md-6 mb-2">
                                <select class="form-select" id="groupId">
                                    <option value="">Выберите группу</option>
                                    <!-- Опции загрузятся JS -->
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-2">Добавить</button>
                    </form>
                </div>
            </div>

            <h5>Список студентов</h5>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО</th>
                        <th>Дата рождения</th>
                        <th>Группа</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <!-- Данные загрузятся JS -->
                </tbody>
            </table>
        </div>

        <!-- Вкладка Группы -->
        <div class="tab-pane fade" id="groups" role="tabpanel">
            <h5>Список групп</h5>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Специальность</th>
                    </tr>
                </thead>
                <tbody id="groupsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Скрипты -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Базовый URL API
    const API_URL = 'http://localhost:8000';

    // 1. Загрузка студентов при старте
    document.addEventListener('DOMContentLoaded', () => {
        loadStudents();
        loadGroups(); // Для выбора в селекте
    });

    // Функция загрузки студентов
    async function loadStudents() {
        try {
            const response = await fetch(`${API_URL}/students/`);
            const students = await response.json();
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';

            students.forEach(s => {
                const row = `<tr>
                    <td>${s.id}</td>
                    <td>${s.full_name}</td>
                    <td>${s.birth_date}</td>
                    <td>${s.group_id || 'Нет'}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('Ошибка загрузки студентов:', error);
        }
    }

    // Функция загрузки групп
    async function loadGroups() {
        try {
            const response = await fetch(`${API_URL}/groups/`);
            const groups = await response.json();
            
            // Обновляем таблицу групп
            const tbody = document.getElementById('groupsTableBody');
            tbody.innerHTML = '';
            groups.forEach(g => {
                tbody.innerHTML += `<tr><td>${g.id}</td><td>${g.name}</td><td>${g.speciality}</td></tr>`;
            });

            // Обновляем селект в форме студента
            const select = document.getElementById('groupId');
            select.innerHTML = '<option value="">Выберите группу</option>';
            groups.forEach(g => {
                const option = document.createElement('option');
                option.value = g.id;
                option.text = `${g.name} (${g.speciality})`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Ошибка загрузки групп:', error);
        }
    }

    // Обработка добавления студента
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newStudent = {
            full_name: document.getElementById('fullName').value,
            birth_date: document.getElementById('birthDate').value,
            snils: document.getElementById('snils').value,
            group_id: parseInt(document.getElementById('groupId').value) || null
        };

        try {
            const response = await fetch(`${API_URL}/students/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newStudent)
            });
            
            if (response.ok) {
                alert('Студент добавлен успешно!');
                document.getElementById('studentForm').reset();
                loadStudents(); // Обновляем таблицу
            } else {
                alert('Ошибка при добавлении');
            }
        } catch (error) {
            console.error('Ошибка:', error);
        }
    });
</script>

</body>
</html>
